name: Publish Shared Packages to GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - ".github/workflows/publish-shared-packages.yml"
  workflow_dispatch:

jobs:
  publish-shared-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@flash-ship'

      - name: Enable Corepack & Install Dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Type-check Shared Packages
        run: yarn type-check

      - name: Build Shared Packages
        run: yarn build

      - name: Publish Packages to GitHub Packages
        run: |
          for pkg in packages/*; do
            if [ -f "$pkg/package.json" ]; then
              echo "Publishing $pkg..."
              (cd "$pkg" && npm publish --access restricted || echo "Package $pkg skipped/already published.")
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
