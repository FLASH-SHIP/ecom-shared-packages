name: Publish Shared Packages to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-shared-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout ecom-shared-packages
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@flash-ship'

      - name: Enable Corepack & Install Dependencies
        run: |
          corepack enable
          yarn install

      - name: Type-check Shared Packages
        run: yarn type-check

      - name: Build Shared Packages
        run: yarn build

      - name: Publish Packages to GitHub Packages
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/package.json" ]; then
              echo "==> Publishing $pkg..."
              (cd "$pkg" && npm publish --registry=https://npm.pkg.github.com --access restricted)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
