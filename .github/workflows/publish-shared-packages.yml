name: Publish Shared Packages to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-shared-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout ecom-shared-packages
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js & Enable Yarn Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@flash-ship'
          cache: 'yarn'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Turbo Build Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install Dependencies
        run: yarn install
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Type-check Shared Packages
        run: yarn type-check

      - name: Build Shared Packages
        run: yarn build

      - name: Auto-Bump Version if Conflict & Publish
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/package.json" ]; then
              PKG_NAME=$(node -p "require('./$pkg/package.json').name")
              CURRENT_VER=$(node -p "require('./$pkg/package.json').version")
              EXISTS=$(npm view "${PKG_NAME}@${CURRENT_VER}" version --registry=https://npm.pkg.github.com 2>/dev/null || echo "")
              if [ -n "$EXISTS" ]; then
                echo "Version $CURRENT_VER for $PKG_NAME already exists on GitHub Packages. Auto-bumping patch version via Node..."
                node -e "
                  const fs = require('fs');
                  const pkgPath = './$pkg/package.json';
                  const data = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                  const parts = data.version.split('.');
                  parts[2] = String(parseInt(parts[2] || '0', 10) + 1);
                  data.version = parts.join('.');
                  fs.writeFileSync(pkgPath, JSON.stringify(data, null, 2) + '\n');
                "
              fi
              echo "==> Publishing $PKG_NAME to GitHub Packages via Yarn Berry..."
              yarn workspace "$PKG_NAME" npm publish --access public
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
