name: Publish Shared Packages to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-shared-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout ecom-shared-packages
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@flash-ship'

      - name: Enable Corepack & Install Dependencies
        run: |
          corepack enable
          yarn install

      - name: Checkout ecom-api dependencies
        uses: actions/checkout@v4
        with:
          repository: FLASH-SHIP/ecom-api
          token: ${{ secrets.GITHUB_TOKEN }}
          path: .ecom-api-temp

      - name: Link ecom-api features & prisma for tRPC build & type-check
        run: |
          mkdir -p packages/features packages/prisma
          NODE_PATH=$PWD/node_modules npx prisma generate --schema .ecom-api-temp/packages/prisma/schema
          cp -r .ecom-api-temp/packages/features/* packages/features/ || true
          cp -r .ecom-api-temp/packages/prisma/* packages/prisma/ || true
          rm -f packages/features/package.json packages/prisma/package.json
          rm -rf .ecom-api-temp

      - name: Type-check Shared Packages
        run: yarn type-check

      - name: Build Shared Packages
        run: yarn build

      - name: Publish Packages to GitHub Packages
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/package.json" ] && [ "$pkg" != "packages/features" ] && [ "$pkg" != "packages/prisma" ]; then
              echo "==> Publishing $pkg..."
              (cd "$pkg" && npm publish --access restricted || true)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
